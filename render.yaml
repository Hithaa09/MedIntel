services:
  # ── Backend API ───────────────────────────────────────────────
  - type: web
    name: medintel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://medintel-frontend.onrender.com,http://localhost:5500,http://127.0.0.1:5500

  # ── Frontend static site ──────────────────────────────────────
  - type: web
    name: medintel-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
